# Что уезжает на телефон при попадании изменений в main.
#
# Развилка одна и решает её отпечаток нативной части. Правки экранов и
# банка вопросов уходят обновлением по воздуху за секунды и квоту сборок не
# трогают. А вот нативный код Android разрешает менять только установкой
# подписанного APK: если отпечаток разошёлся с уже выпущенным, обновление
# никому не доедет, и вместо него запускается сборка.
name: Выкатка в main

on:
  push:
    branches: [main]
  # Ручной запуск: перевыложить тот же код, не делая пустой коммит.
  workflow_dispatch:

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

# Нужно джобе версии, чтобы запушить подъём, и вызываемой сборке, чтобы
# создать релиз с APK.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  native:
    name: Менялась ли нативная часть
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Сверка отпечатков
        id: compare
        run: |
          set -euo pipefail

          current=$(npx expo-updates fingerprint:generate --platform android | jq -er '.hash')

          # Отпечаток уже выпущенного APK лежит в том же android.json,
          # который читает приложение. Нет выпуска или не достучались —
          # считаем, что нативная часть менялась: лишняя сборка дешевле,
          # чем правка, молча не доехавшая до телефона.
          shipped=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/android.json" | jq -er '.runtimeVersion') || shipped=""

          if [ "$current" = "$shipped" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Отпечаток тот же ($current). Хватит обновления по воздуху." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Отпечаток разошёлся: было ${shipped:-выпуска нет}, стало $current. Нужна сборка APK." >> "$GITHUB_STEP_SUMMARY"
          fi

  version:
    name: Версия
    # Ждёт проверок: без этого версия поднималась бы и уезжала в main даже
    # тогда, когда тесты красные и выкатывать нечего.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Поднять патч-версию
        # Версия меняется на каждом попадании в main: по ней видно, что
        # приехало на телефон, и по ней же называются APK.
        #
        # Вместе с ней растёт versionCode: Android иначе не примет установку
        # поверх, а поднимать его руками — значит однажды забыть.
        # [skip ci] в сообщении: без него коммит запустил бы этот же workflow.
        working-directory: app
        run: |
          set -euo pipefail
          next=$(node -e "const v=require('./app.json').expo.version.split('.').map(Number); v[2]+=1; console.log(v.join('.'))")
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.version = process.argv[1];
            config.expo.android.versionCode = (config.expo.android.versionCode ?? 0) + 1;
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          " "$next"
          code=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Версия $next ($code) [skip ci]"
          git push

  # Нативная часть изменилась — по воздуху её не доставить, собираем APK.
  build:
    name: Сборка APK
    needs: [version, native]
    if: needs.native.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Изменился только JS или банк — обновление уезжает на телефон само.
  update:
    name: EAS Update
    needs: [version, native]
    if: needs.native.outputs.changed == 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          # Обновление публикуется уже с поднятой версией.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Публикация обновления
        # Сообщение через переменную окружения, а не подстановкой в команду:
        # в тексте коммита бывают кавычки и переводы строк.
        env:
          MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        # Ветка обновлений называется так же, как канал в eas.json: сборка с
        # каналом production получает обновления ветки production.
        # Платформа одна: без --platform EAS собирал бы ещё web, а его в
        # проекте нет и сборка падала бы на react-native-web.
        run: eas update --platform android --branch production --message "$MESSAGE" --non-interactive
